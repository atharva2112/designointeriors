# TEMPORARY: collects candidate client logos into scratch/logos/ for review. Removed once the
# logos are chosen.
name: Find client logos

on:
  push:
    branches: [claude/friendly-edison-25hqh1]
    paths: [scripts/find-client-logos.js, scripts/fetch-logo-originals.js, scratch/logos/wanted.json, .github/workflows/find-client-logos.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: find-client-logos
  cancel-in-progress: true

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect candidates
        run: |
          if [ -f scratch/logos/wanted.json ]; then node scripts/fetch-logo-originals.js; else node scripts/find-client-logos.js; fi

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          git add scratch
          if git diff --cached --quiet; then echo "Nothing found."; exit 0; fi
          git commit -q -m "Collect candidate client logos for review (temporary)"
          git push origin "HEAD:$BRANCH"
