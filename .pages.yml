# Pages CMS configuration — https://pagescms.org/docs
media:
  input: media
  output: /media

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [ cover, name, sector, featured, hidden ]
      sort: [ order, name ]
    fields:
      - { name: name, label: Name, type: string, required: true, description: "Client or project name. Also becomes the page address." }
      - name: sector
        label: Sector
        type: select
        required: true
        options:
          values: [ { value: corporate, label: "Corporate Offices" }, { value: retail, label: "Retail and Showrooms" }, { value: hospitality, label: "Hospitality" }, { value: education, label: "Education" }, { value: fitness, label: "Fitness Centres" }, { value: healthcare, label: "Healthcare" }, { value: studios, label: "Studios" }, { value: residential, label: "Residential" } ]
      - { name: client, label: Client name, type: string, required: true, description: "Write Confidential for projects under NDA." }
      - { name: area, label: Area (sq ft), type: number, description: "Digits only, e.g. 7500" }
      - { name: summary, label: Summary, type: text, required: true, description: "One or two sentences. Also used for Google." }
      - { name: location, label: Location, type: string, description: "e.g. Kohinoor City, Kurla. Also places the project on the matching location page." }
      - { name: year, label: Year completed, type: string }
      - { name: duration, label: Duration, type: string, description: "e.g. 45 days" }
      - { name: scope, label: Scope, type: string, list: true, description: "e.g. Design, Civil work, Joinery, Electrical, Furniture" }
      - { name: challenge, label: The challenge, type: text, description: "Optional case study. What the client needed and what made it hard." }
      - { name: solution, label: Our approach, type: text }
      - { name: outcome, label: The outcome, type: text }
      - { name: cover, label: Cover image, type: image, required: true, description: "Best landscape photo, about 2400px wide." }
      - { name: gallery, label: Photo gallery, type: image, list: true, description: "Drag to reorder." }
      - { name: featured, label: Show on homepage, type: boolean, default: false, description: "Keep about five switched on." }
      - { name: order, label: Order, type: number, description: "Lower numbers appear first." }
      - { name: hidden, label: Hide from site, type: boolean, default: false }

  - name: services
    label: Services
    type: collection
    path: content/services
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [ image, title, group, order, hidden ]
      sort: [ order, title ]
    fields:
      - { name: title, label: Title, type: string, required: true, description: "Also becomes the page address, e.g. services/office-fit-out/." }
      - name: group
        label: Group
        type: select
        default: interiors
        options:
          values: [ { value: interiors, label: "Interiors (Services page)" }, { value: technology, label: "Technology & systems (Technology page)" } ]
      - { name: summary, label: Summary, type: text, required: true, description: "One sentence for the Services page, the homepage and the footer." }
      - { name: intro, label: Introduction, type: text, description: "The opening paragraph at the top of the page." }
      - { name: image, label: Image, type: image }
      - name: points
        label: What you get
        type: object
        list: true
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - { name: includes, label: What’s included, type: string, list: true }
      - name: sectors
        label: Sectors
        type: select
        options:
          multiple: true
          values: [ { value: corporate, label: "Corporate Offices" }, { value: retail, label: "Retail and Showrooms" }, { value: hospitality, label: "Hospitality" }, { value: education, label: "Education" }, { value: fitness, label: "Fitness Centres" }, { value: healthcare, label: "Healthcare" }, { value: studios, label: "Studios" } ]
      - { name: projects, label: Example projects, type: string, list: true, description: "Page addresses of projects that show this service, e.g. wincor-nixdorf." }
      - name: faqs
        label: Questions and answers
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
      - { name: metaDescription, label: Google description, type: text, description: "One or two sentences shown in search results." }
      - { name: order, label: Order, type: number, description: "Lower numbers appear first." }
      - { name: hidden, label: Hide from site, type: boolean, default: false }

  - name: journal
    label: Journal
    type: collection
    path: content/journal
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [ cover, title, category, date, hidden ]
      sort: [ date ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: category
        label: Category
        type: select
        options:
          values: [ Workplace, Vastu, Sustainability, Technology, News ]
      - { name: date, label: Date, type: date, required: true }
      - { name: cover, label: Cover image, type: image }
      - { name: excerpt, label: Excerpt, type: text, required: true, description: "One sentence shown on the Journal page." }
      - { name: body, label: Body, type: rich-text }
      - { name: hidden, label: Hide from site, type: boolean, default: false }

  - name: jobs
    label: Jobs
    type: collection
    path: content/jobs
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [ title, type, place, hidden ]
    fields:
      - { name: title, label: Role, type: string, required: true }
      - { name: type, label: Type, type: string, description: "e.g. Full-time, 6 months" }
      - { name: place, label: Location, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: order, label: Order, type: number }
      - { name: hidden, label: Hide (role filled), type: boolean, default: false }

  - name: clients
    label: Clientele
    type: file
    path: content/clients.json
    format: json
    fields:
      - name: wall
        label: Client logos (homepage “Trusted by” and top of this page)
        type: object
        list: true
        description: "Drag to reorder. Only clients with a logo are shown, on the homepage and at the top of the Clientele page."
        fields:
          - { name: name, label: Client, type: string, required: true }
          - { name: logo, label: Logo, type: image, description: "SVG or a PNG with a transparent background, cropped tight to the logo." }
      - name: offices
        label: Offices & institutions
        type: object
        list: true
        fields:
          - { name: name, label: Client, type: string }
          - { name: place, label: Location, type: string }
          - { name: area, label: Area (sq ft), type: number }
      - name: groups
        label: Other sectors
        type: object
        list: true
        fields:
          - { name: name, label: Group name, type: string }
          - { name: items, label: Clients, type: string, list: true }
          - { name: hidden, label: Hide from site, type: boolean, default: false }
      - { name: homes, label: Number of homes, type: string }
      - { name: homeAreas, label: Residential areas, type: text }
      - { name: showHomes, label: Show the private homes block, type: boolean, default: false, description: "Residential is hidden on this site for now. Switch on to show the homes count again." }

  - name: sectors
    label: Sectors
    type: file
    path: content/sectors.json
    format: json
    list: true
    fields:
      - { name: id, label: ID (do not change), type: string }
      - { name: name, label: Name, type: string }
      - { name: blurb, label: Description, type: text, description: "One line for lists and cards." }
      - { name: image, label: Image, type: image }
      - { name: title, label: Page heading, type: string, description: "e.g. Corporate office interiors" }
      - { name: intro, label: Introduction, type: text, description: "The opening paragraph of the sector page." }
      - name: points
        label: What we focus on
        type: object
        list: true
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - { name: deliverables, label: What we design and build, type: string, list: true }
      - { name: clients, label: Clients to list, type: string, list: true, description: "e.g. Castrol India, R&D — Wadala" }
      - name: faqs
        label: Questions and answers
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
      - { name: metaDescription, label: Google description, type: text }
      - { name: hidden, label: Hide from site, type: boolean, default: false, description: "Hides the sector everywhere: lists, filters, forms and its page." }

  - name: locations
    label: Locations
    type: collection
    path: content/locations
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [ image, name, order, hidden ]
      sort: [ order, name ]
    fields:
      - { name: name, label: Area name, type: string, required: true, description: "e.g. Kurla & Kohinoor City. Also becomes the page address." }
      - { name: title, label: Page heading, type: string, required: true, description: "e.g. Office interiors in Kurla and Kohinoor City" }
      - { name: intro, label: Introduction, type: text, required: true }
      - { name: image, label: Image, type: image }
      - name: points
        label: Why Designo here
        type: object
        list: true
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - { name: match, label: Place names to match, type: string, list: true, description: "Clients (Clientele lists) and projects whose location contains any of these words are listed on the page, e.g. Kurla, Kohinoor." }
      - { name: metaDescription, label: Google description, type: text }
      - { name: order, label: Order, type: number }
      - { name: hidden, label: Hide from site, type: boolean, default: false }

  - name: faqs
    label: FAQ
    type: file
    path: content/faqs.json
    format: json
    list: true
    fields:
      - name: topic
        label: Topic
        type: select
        options:
          values: [ Getting started, Cost & payment, Timelines, Standards & compliance, During works, After handover ]
      - { name: question, label: Question, type: string, required: true }
      - { name: answer, label: Answer, type: text, required: true }
      - { name: hidden, label: Hide from site, type: boolean, default: false }

  - name: testimonials
    label: Testimonials
    type: file
    path: content/testimonials.json
    format: json
    list: true
    fields:
      - { name: quote, label: Quote, type: text, required: true, description: "Only publish quotes the client has approved." }
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Role, type: string, description: "e.g. Head of Administration" }
      - { name: company, label: Company, type: string }
      - { name: project, label: Project page, type: string, description: "Optional. The project's page address, e.g. wincor-nixdorf, to show the quote on that project too." }
      - { name: hidden, label: Hide from site, type: boolean, default: false }

  - name: notifications
    label: "Settings → Notifications"
    type: file
    path: content/settings/notifications.json
    format: json
    fields:
      - name: forms
        label: Who gets alerted, per form
        type: object
        list: true
        fields:
          - name: form
            label: Form
            type: select
            options:
              values: [ { value: quote, label: Get a quote }, { value: brief, label: Project brief }, { value: consultation, label: Book a consultation }, { value: careers, label: Careers }, { value: referral, label: Referral programme }, { value: ecovisions, label: EcoVisions } ]
          - { name: emails, label: Email addresses, type: string, list: true }
          - { name: whatsapp, label: "WhatsApp numbers (with 91, e.g. 919820111353)", type: string, list: true }

  - name: estimator
    label: "Settings → Cost estimator"
    type: file
    path: content/settings/estimator.json
    format: json
    fields:
      - name: levels
        label: Specification levels
        type: object
        list: true
        description: "Rates in ₹ per sq ft. The estimator page goes live once at least one level has both rates filled in."
        fields:
          - { name: name, label: Name, type: string }
          - { name: note, label: What it includes, type: text }
          - { name: min, label: "From (₹ per sq ft)", type: number }
          - { name: max, label: "To (₹ per sq ft)", type: number }
      - name: addons
        label: Add-ons
        type: object
        list: true
        description: "Optional extras visitors can tick, in ₹ per sq ft. Left out until both rates are filled in."
        fields:
          - { name: name, label: Name, type: string }
          - { name: min, label: "From (₹ per sq ft)", type: number }
          - { name: max, label: "To (₹ per sq ft)", type: number }
      - { name: minArea, label: Smallest area (sq ft), type: number }
      - { name: maxArea, label: Largest area (sq ft), type: number }
      - { name: defaultArea, label: Starting area (sq ft), type: number }
      - { name: disclaimer, label: Small print, type: text }

  - name: site
    label: "Settings → Site"
    type: file
    path: content/settings/site.json
    format: json
    fields:
      - { name: phone, label: Phone (display), type: string }
      - { name: phoneLink, label: Phone (for tap-to-call), type: string }
      - { name: whatsapp, label: WhatsApp number, type: string }
      - { name: email, label: Email, type: string }
      - { name: hours, label: Opening hours, type: string }
      - { name: formsEndpoint, label: Forms web app URL, type: string, description: "From Google Apps Script → Deploy. Leave alone once set." }
      - name: stats
        label: Homepage stats
        type: object
        list: true
        fields:
          - { name: value, label: Value, type: string }
          - { name: label, label: Label, type: string }
          - { name: note, label: Note, type: string }
      - name: brochures
        label: Brochure downloads
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: file, label: PDF, type: file }
      - name: images
        label: Page images
        type: object
        fields:
          - { name: automation, label: Workplace technology (homepage), type: image }
          - { name: technology, label: Technology page banner, type: image }
          - { name: sustainability, label: EcoVisions, type: image }
          - { name: vastu, label: Vastu, type: image }
          - { name: about, label: About banner, type: image }
          - { name: founder, label: Founder portrait, type: image }
          - { name: process, label: Fit-out process banner (optional), type: image }
          - { name: occupied, label: Fit-out process — working around your team (optional), type: image }
          - { name: initiatives, label: EcoVisions — our initiatives (optional; uses the Vastu photo until set), type: image }
          - { name: aboutStyle, label: About — our style (optional), type: image }
          - { name: aboutApproach, label: About — our approach (optional), type: image }
          - { name: aboutNetwork, label: About — our network (optional), type: image }
          - { name: brief, label: Project brief page (optional), type: image }
          - { name: careers, label: Careers banner (optional), type: image }
      - name: showreel
        label: Homepage video
        type: object
        fields:
          - { name: video, label: Vimeo background URL, type: string }
          - { name: poster, label: Poster image, type: image }
      - name: offices
        label: Offices
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: address, label: Address, type: text }
          - { name: mapQuery, label: Map search text, type: string }
      - name: social
        label: Social links
        type: object
        list: true
        fields:
          - { name: name, label: Network, type: string }
          - { name: url, label: URL, type: string }
      - { name: url, label: Website address, type: string }
